<script>
(function() {
  const SYMBOLS = [
    { sym: 'BTCUSDT', label: 'BTC / USDT' },
    { sym: 'SOLUSDT', label: 'SOL / USDT' },

    { sym: 'ADAUSDT', label: 'ADA / USDT' },
    { sym: 'AVAXUSDT', label: 'AVAX / USDT' },
    { sym: 'LINKUSDT', label: 'LINK / USDT' },
    { sym: 'DOTUSDT', label: 'DOT / USDT' },
    { sym: 'TRXUSDT', label: 'TRX / USDT' },
    { sym: 'POLUSDT', label: 'POL / USDT' },
    { sym: 'UNIUSDT', label: 'UNI / USDT' },
    { sym: 'ATOMUSDT', label: 'ATOM / USDT' },
    { sym: 'NEARUSDT', label: 'NEAR / USDT' },
    { sym: 'APTUSDT', label: 'APT / USDT' },
    { sym: 'ARBUSDT', label: 'ARB / USDT' },
    { sym: 'OPUSDT', label: 'OP / USDT' },
    { sym: 'SUIUSDT', label: 'SUI / USDT' },
    { sym: 'INJUSDT', label: 'INJ / USDT' },
    { sym: 'FILUSDT', label: 'FIL / USDT' },
    { sym: 'TIAUSDT', label: 'TIA / USDT' },
    { sym: 'BCHUSDT', label: 'BCH / USDT' },
    { sym: 'XLMUSDT', label: 'XLM / USDT' },
    { sym: 'ETCUSDT', label: 'ETC / USDT' },
    { sym: 'TONUSDT', label: 'TON / USDT' }
  ];

  const root = document.getElementById('app-root');
  const chartState = {}; // sym -> { points: [{t, c}], canvas, ctx }
  const tradeState = {}; // sym -> { status: 'idle'|'active'|'closed', direction, entry, sl, tp, strength, rr, outcome }
  const lastAnalysis = {}; // sym -> latest computeSignal() result, refreshed every 6s
  const watchAlertState = {}; // sym -> last WATCH direction already alerted ('LONG'/'SHORT'/null)
  const weeklyStats = { signals: 0, tp: 0, sl: 0, invalidated: 0, weekStart: Date.now() };
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  // Telegram alerts now run server-side (netlify/functions/check-signals.js) on a
  // schedule, independent of this page — set TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  // as Netlify environment variables, never in this client file. Keeping a token
  // in public page source would let anyone viewing the site's source use your bot.
  let ws = null;

  function ema(values, period) {
    const k = 2 / (period + 1);
    let emaArr = [values[0]];
    for (let i = 1; i < values.length; i++) {
      emaArr.push(values[i] * k + emaArr[i - 1] * (1 - k));
    }
    return emaArr;
  }

  function rsi(values, period) {
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
      const diff = values[i] - values[i - 1];
      if (diff >= 0) gains += diff; else losses -= diff;
    }
    let avgGain = gains / period, avgLoss = losses / period;
    for (let i = period + 1; i < values.length; i++) {
      const diff = values[i] - values[i - 1];
      const g = diff > 0 ? diff : 0;
      const l = diff < 0 ? -diff : 0;
      avgGain = (avgGain * (period - 1) + g) / period;
      avgLoss = (avgLoss * (period - 1) + l) / period;
    }
    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
  }

  function atr(candles, period) {
    const trs = [];
    for (let i = 1; i < candles.length; i++) {
      const cur = candles[i], prev = candles[i - 1];
      const tr = Math.max(
        cur.high - cur.low,
        Math.abs(cur.high - prev.close),
        Math.abs(cur.low - prev.close)
      );
      trs.push(tr);
    }
    let atrVal = trs.slice(0, period).reduce((a, b) => a + b, 0) / period;
    for (let i = period; i < trs.length; i++) {
      atrVal = (atrVal * (period - 1) + trs[i]) / period;
    }
    return atrVal;
  }

  function adx(candles, period) {
    const plusDM = [], minusDM = [], tr = [];
    for (let i = 1; i < candles.length; i++) {
      const upMove = candles[i].high - candles[i - 1].high;
      const downMove = candles[i - 1].low - candles[i].low;
      plusDM.push((upMove > downMove && upMove > 0) ? upMove : 0);
      minusDM.push((downMove > upMove && downMove > 0) ? downMove : 0);
      tr.push(Math.max(
        candles[i].high - candles[i].low,
        Math.abs(candles[i].high - candles[i - 1].close),
        Math.abs(candles[i].low - candles[i - 1].close)
      ));
    }
    function wilderSmooth(arr) {
      let smoothed = [arr.slice(0, period).reduce((a, b) => a + b, 0)];
      for (let i = period; i < arr.length; i++) {
        smoothed.push(smoothed[smoothed.length - 1] - (smoothed[smoothed.length - 1] / period) + arr[i]);
      }
      return smoothed;
    }
    const smTR = wilderSmooth(tr), smPlusDM = wilderSmooth(plusDM), smMinusDM = wilderSmooth(minusDM);
    const plusDI = smPlusDM.map((v, i) => 100 * (v / (smTR[i] || 1)));
    const minusDI = smMinusDM.map((v, i) => 100 * (v / (smTR[i] || 1)));
    const dx = plusDI.map((v, i) => 100 * Math.abs(v - minusDI[i]) / ((v + minusDI[i]) || 1));
    const adxVal = dx.slice(-period).reduce((a, b) => a + b, 0) / Math.min(period, dx.length);
    return { adx: adxVal, plusDI: plusDI[plusDI.length - 1], minusDI: minusDI[minusDI.length - 1] };
  }

  function bollinger(closes, period, mult) {
    const slice = closes.slice(-period);
    const sma = slice.reduce((a, b) => a + b, 0) / period;
    const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
    const stdev = Math.sqrt(variance);
    const upper = sma + mult * stdev, lower = sma - mult * stdev;
    const last = closes[closes.length - 1];
    const percentB = (last - lower) / ((upper - lower) || 1);
    return { sma, upper, lower, percentB };
  }

  function findSwingLevels(candles, lookback) {
    // Exclude the currently-forming candle (last index) so the level is based on
    // completed price action, not an incomplete bar.
    const relevant = candles.slice(-(lookback + 1), -1);
    const highs = relevant.map(c => c.high);
    const lows = relevant.map(c => c.low);
    return { swingHigh: Math.max(...highs), swingLow: Math.min(...lows) };
  }

  async function fetchKlines(symbol, interval, limit) {
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed: ' + symbol);
    const data = await res.json();
    return data.map(c => ({
      high: parseFloat(c[2]),
      low: parseFloat(c[3]),
      close: parseFloat(c[4]),
      volume: parseFloat(c[5]),
      time: c[0]
    }));
  }

  function macd(closes, fast = 12, slow = 26, signalPeriod = 9) {
    const emaFast = ema(closes, fast);
    const emaSlow = ema(closes, slow);
    const macdLine = closes.map((_, i) => emaFast[i] - emaSlow[i]);
    const signalLine = ema(macdLine, signalPeriod);
    const last = macdLine.length - 1;
    return { line: macdLine[last], signal: signalLine[last], hist: macdLine[last] - signalLine[last] };
  }

  function computeSignal(closes4h, closes1h, candles1h, volumes1h, closes15m) {
    const emaSeries = ema(closes4h, 50);
    const emaNow = emaSeries[emaSeries.length - 1];
    const price = closes4h[closes4h.length - 1];
    const trendUp = price > emaNow;
    const distPct = ((price - emaNow) / emaNow) * 100;

    const rsiNow = rsi(closes1h, 14);
    const atrNow = atr(candles1h, 14);
    const { line: macdLine, signal: macdSignalLine, hist: macdHist } = macd(closes1h);
    const macdBullish = macdLine > macdSignalLine;

    const avgVolume = volumes1h.slice(-21, -1).reduce((a, b) => a + b, 0) / 20;
    const lastVolume = volumes1h[volumes1h.length - 1];
    const volRatio = avgVolume > 0 ? lastVolume / avgVolume : 1;
    const volumeConfirmed = lastVolume > avgVolume;

    const { adx: adxNow } = adx(candles1h, 14);
    const trending = adxNow > 20;

    const ema15 = ema(closes15m, 20);
    const trendUp15m = closes15m[closes15m.length - 1] > ema15[ema15.length - 1];

    const bb = bollinger(closes1h, 20, 2);
    const { swingHigh, swingLow } = findSwingLevels(candles1h, 40);

    let signal = 'WAIT';
    let reason = '';
    let sl = null, tp = null, rr = null, strength = null;

    const rsiLongZone = rsiNow >= 40 && rsiNow <= 55;
    const rsiShortZone = rsiNow >= 45 && rsiNow <= 60;

    let signalStrength = null;
    let watchDirection = null;

    if (trendUp && rsiLongZone && macdBullish && volumeConfirmed && trending && trendUp15m) {
      signal = 'LONG';
      reason = '4h+15m uptrend aligned, RSI pullback, MACD bullish, volume confirmed, ADX trending';
      strength = setupStrength(distPct, rsiNow, 47.5, macdHist, atrNow, volRatio, adxNow, bb.percentB, true);
      ({ sl, tp, rr } = structuralTargets('LONG', price, atrNow, swingLow, swingHigh, strength));
    } else if (!trendUp && rsiShortZone && !macdBullish && volumeConfirmed && trending && !trendUp15m) {
      signal = 'SHORT';
      reason = '4h+15m downtrend aligned, RSI bounce, MACD bearish, volume confirmed, ADX trending';
      strength = setupStrength(distPct, rsiNow, 52.5, macdHist, atrNow, volRatio, adxNow, bb.percentB, false);
      ({ sl, tp, rr } = structuralTargets('SHORT', price, atrNow, swingLow, swingHigh, strength));
    } else if (trendUp) {
      const missing = [];
      if (!rsiLongZone) missing.push('RSI not in pullback zone');
      if (!macdBullish) missing.push('MACD not bullish');
      if (!volumeConfirmed) missing.push('volume below average');
      if (!trending) missing.push('ADX < 20 (no trend strength)');
      if (!trendUp15m) missing.push('15m trend not aligned');
      reason = 'Uptrend but ' + missing.join(', ');
      // Watch tier: the core three (trend + RSI + MACD) already agree — worth
      // keeping an eye on, but not a confirmed entry until ADX/volume/15m catch up.
      if (rsiLongZone && macdBullish) {
        signal = 'WATCH';
        watchDirection = 'LONG';
        signalStrength = setupStrength(distPct, rsiNow, 47.5, macdHist, atrNow, volRatio, adxNow, bb.percentB, true);
      }
    } else {
      const missing = [];
      if (!rsiShortZone) missing.push('RSI not in bounce zone');
      if (macdBullish) missing.push('MACD not bearish');
      if (!volumeConfirmed) missing.push('volume below average');
      if (!trending) missing.push('ADX < 20 (no trend strength)');
      if (trendUp15m) missing.push('15m trend not aligned');
      reason = 'Downtrend but ' + missing.join(', ');
      if (rsiShortZone && !macdBullish) {
        signal = 'WATCH';
        watchDirection = 'SHORT';
        signalStrength = setupStrength(distPct, rsiNow, 52.5, macdHist, atrNow, volRatio, adxNow, bb.percentB, false);
      }
    }

    // Diagnostic checklist: which of the 5 non-trend factors currently pass, for
    // whichever direction the 4h trend points — lets you see exactly what's
    // still missing instead of guessing why nothing has fired.
    const checklist = {
      rsiZone: trendUp ? rsiLongZone : rsiShortZone,
      macd: trendUp ? macdBullish : !macdBullish,
      volume: volumeConfirmed,
      adx: trending,
      tf15m: trendUp ? trendUp15m : !trendUp15m
    };

    return { signal, reason, trendUp, emaNow, price, distPct, rsiNow, sl, tp, rr, atrNow, strength,
      watchDirection, signalStrength, checklist,
      macdLine, macdSignalLine, macdHist, macdBullish, volRatio, volumeConfirmed, adxNow, trending,
      trendUp15m, bbPercentB: bb.percentB,
      ...riskMetrics(price, atrNow, sl) };
  }

  function structuralTargets(direction, price, atrNow, swingLow, swingHigh, strength) {
    // Reward target scales with setup quality (1.5x for a weak 0/10 setup, up to 3.5x
    // for a clean 10/10) instead of a flat multiple — so RR itself varies per trade.
    const rrTarget = 1.5 + (strength / 10) * 2;
    const minStopDist = atrNow * 0.5;  // never let structure put the stop unrealistically tight
    const maxStopDist = atrNow * 3;    // never let a distant/no swing level blow the stop out too wide

    let sl, tp;
    if (direction === 'LONG') {
      let stopDist = price - (swingLow - atrNow * 0.25);
      stopDist = Math.min(Math.max(stopDist, minStopDist), maxStopDist);
      sl = price - stopDist;
      tp = price + stopDist * rrTarget;
    } else {
      let stopDist = (swingHigh + atrNow * 0.25) - price;
      stopDist = Math.min(Math.max(stopDist, minStopDist), maxStopDist);
      sl = price + stopDist;
      tp = price - stopDist * rrTarget;
    }
    return { sl, tp, rr: Math.round(rrTarget * 10) / 10 };
  }

  function setupStrength(distPct, rsiNow, rsiCenter, macdHist, atrNow, volRatio, adxNow, bbPercentB, isLong) {
    // Trend clarity (0-2): separation from EMA, caps at 3% move
    const trendScore = Math.min(Math.abs(distPct) / 3, 1) * 2;
    // RSI centering (0-2): closer to the middle of the pullback zone scores higher
    const rsiScore = Math.max(0, 1 - Math.abs(rsiNow - rsiCenter) / 7.5) * 2;
    // MACD conviction (0-2): histogram size relative to volatility
    const macdScore = Math.min(Math.abs(macdHist) / (atrNow * 0.08 || 1), 1) * 2;
    // Volume conviction (0-2): how far above average volume is
    const volScore = Math.min(Math.max(volRatio - 1, 0) / 1, 1) * 2;
    // ADX conviction (0-1.5): stronger trend strength above the 20 threshold
    const adxScore = Math.min(Math.max(adxNow - 20, 0) / 20, 1) * 1.5;
    // Bollinger positioning (0-0.5): penalize entries already stretched to the band edge
    const bbEdge = isLong ? bbPercentB : (1 - bbPercentB);
    const bbScore = Math.max(0, 1 - Math.max(bbEdge - 0.85, 0) / 0.15) * 0.5;
    return Math.round(Math.min(10, trendScore + rsiScore + macdScore + volScore + adxScore + bbScore));
  }

  function riskTier(volPct) {
    if (volPct < 1) return { label: 'LOW', color: '#26a69a' };
    if (volPct < 2.5) return { label: 'MEDIUM', color: '#f0b90b' };
    return { label: 'HIGH', color: '#ef5350' };
  }

  function riskMetrics(price, atrNow, sl) {
    const volPct = (atrNow / price) * 100;
    const tier = riskTier(volPct);
    let slDistPct = null, maxLeverage = null;
    if (sl !== null) {
      slDistPct = (Math.abs(price - sl) / price) * 100;
      // keep enough buffer that the stop hits before liquidation (20% margin buffer)
      maxLeverage = Math.max(1, Math.min(20, Math.floor(80 / slDistPct)));
    }
    return { volPct, riskTierLabel: tier.label, riskTierColor: tier.color, slDistPct, maxLeverage };
  }

  function fmtPrice(p) {

    if (p >= 1) return p.toFixed(3);

    return p.toFixed(6);
  }

  function resizeCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, rect.width * dpr);
    canvas.height = Math.max(1, rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return rect;
  }

  function drawChart(sym) {
    const state = chartState[sym];
    if (!state || state.points.length < 2) return;
    const { canvas, ctx } = state;
    const rect = resizeCanvas(canvas);
    const w = rect.width, h = rect.height;
    ctx.clearRect(0, 0, w, h);

    const closes = state.points.map(p => p.c);
    const min = Math.min(...closes), max = Math.max(...closes);
    const range = (max - min) || (min * 0.001) || 1;
    const pad = 4;
    const step = (w - pad * 2) / (closes.length - 1);
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#26a69a' : '#ef5350';

    ctx.beginPath();
    closes.forEach((c, i) => {
      const x = pad + i * step;
      const y = pad + (h - pad * 2) * (1 - (c - min) / range);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // fill under line
    const lastX = pad + (closes.length - 1) * step;
    ctx.lineTo(lastX, h);
    ctx.lineTo(pad, h);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color + '33');
    grad.addColorStop(1, color + '00');
    ctx.fillStyle = grad;
    ctx.fill();

    // live dot at last point
    const lastY = pad + (h - pad * 2) * (1 - (closes[closes.length - 1] - min) / range);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 2.8, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  async function seedChart(sym) {
    try {
      const candles = await fetchKlines(sym, '1m', 90);
      chartState[sym].points = candles.map(c => ({ t: c.time, c: c.close }));
      drawChart(sym);
    } catch (e) { /* seeding failed, live stream will fill in */ }
  }

  function connectLiveStream() {
    if (ws) { try { ws.close(); } catch (e) {} }
    const streams = SYMBOLS.map(s => s.sym.toLowerCase() + '@kline_1m').join('/');
    ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

    ws.onmessage = (msg) => {
      try {
        const payload = JSON.parse(msg.data);
        const k = payload.data && payload.data.k;
        if (!k) return;
        const sym = payload.data.s;
        const state = chartState[sym];
        if (!state) return;
        const close = parseFloat(k.c);
        const openTime = k.t;
        const pts = state.points;
        if (pts.length && pts[pts.length - 1].t === openTime) {
          pts[pts.length - 1].c = close;
        } else {
          pts.push({ t: openTime, c: close });
          if (pts.length > 90) pts.shift();
        }
        drawChart(sym);
        const priceEl = document.getElementById(`price-${sym}`);
        if (priceEl) priceEl.textContent = '$' + fmtPrice(close);
        checkTradeClose(sym, close);
      } catch (e) { /* ignore malformed frame */ }
    };

    ws.onclose = () => { setTimeout(connectLiveStream, 3000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  function checkEmergency(sym, result) {
    const ts = tradeState[sym];
    if (!ts || ts.status !== 'active') return;

    const TREND_FLIP_BUFFER = 0.15; // % beyond EMA required to count as a real reversal, not a whisker cross
    const VOL_SPIKE_MULT = 3;       // require ATR to TRIPLE (not just double) — 1h ATR naturally drifts during
                                     // the forming candle, 2x was catching normal noise, not real regime change
    const CONFIRM_STRIKES = 2;      // condition must hold for 2 consecutive 5s checks before acting — filters
                                     // one-off blips instead of reacting to every transient reading

    let trendFlipped = false;
    if (ts.direction === 'LONG' && ts.trendUpAtOpen && !result.trendUp && Math.abs(result.distPct) > TREND_FLIP_BUFFER) {
      trendFlipped = true;
    } else if (ts.direction === 'SHORT' && !ts.trendUpAtOpen && result.trendUp && Math.abs(result.distPct) > TREND_FLIP_BUFFER) {
      trendFlipped = true;
    }
    const volSpiked = result.atrNow > ts.atrAtOpen * VOL_SPIKE_MULT;

    ts.trendFlipStrikes = trendFlipped ? (ts.trendFlipStrikes || 0) + 1 : 0;
    ts.volSpikeStrikes = volSpiked ? (ts.volSpikeStrikes || 0) + 1 : 0;

    let reason = null;
    if (ts.trendFlipStrikes >= CONFIRM_STRIKES) {
      reason = ts.direction === 'LONG'
        ? 'Trend flipped bearish and held — the uptrend this LONG was based on is gone'
        : 'Trend flipped bullish and held — the downtrend this SHORT was based on is gone';
    } else if (ts.volSpikeStrikes >= CONFIRM_STRIKES) {
      reason = 'Volatility spike confirmed — ATR more than tripled since entry and held, SL distance may not hold';
    }

    if (reason) {
      ts.status = 'emergency';
      ts.emergencyReason = reason;
      ts.emergencyAt = Date.now();
      ts.emergencyPrice = result.price;
      weeklyStats.invalidated++;
      renderWeeklyStats();
      // Alert already sent by the server-side function — this tab just reflects it visually.
    }
  }

      weeklyStats.invalidated = 0;

  function checkTradeClose(sym, price) {
    const ts = tradeState[sym];
    if (!ts || ts.status !== 'active') return;
    let hit = null;
    if (ts.direction === 'LONG') {
      if (price >= ts.tp) hit = 'WON';
      else if (price <= ts.sl) hit = 'LOST';
    } else {
      if (price <= ts.tp) hit = 'WON';
      else if (price >= ts.sl) hit = 'LOST';
    }
    if (hit) {
      ts.status = 'closed';
      ts.outcome = hit;
      ts.closedAt = Date.now();
      ts.closePrice = price;
      if (hit === 'WON') weeklyStats.tp++; else weeklyStats.sl++;
      renderWeeklyStats();
      renderCard(sym);
      // Alert already sent by the server-side function — this tab just reflects it visually.
    }
  }

        ${checkRow('Volume', c.volume)}
        ${checkRow('ADX>20', c.adx)}
        ${checkRow('15m align', c.tf15m)}
      </div>
    `;

    const trendLabel = result.trendUp ? 'UP (above 4h EMA50)' : 'DOWN (below 4h EMA50)';
    const reasonLabel = (ts && ts.status === 'active') ? 'Live conditions' : 'Reason';
    document.getElementById(`rows-${sym}`).innerHTML = `
      <div><span>${reasonLabel}</span><span>${result.reason}</span></div>
      <div><span>4h trend</span><span>${trendLabel}</span></div>
      <div><span>4h EMA50</span><span>$${fmtPrice(result.emaNow)}</span></div>
      <div><span>Dist. from EMA</span><span>${result.distPct.toFixed(2)}%</span></div>
      <div><span>1h RSI(14)</span><span>${result.rsiNow.toFixed(1)}</span></div>
      <div><span>1h ATR(14)</span><span>$${fmtPrice(result.atrNow)}</span></div>
      <div><span>1h MACD</span><span>${result.macdBullish ? 'Bullish' : 'Bearish'}</span></div>
      <div><span>1h Volume vs avg</span><span>${result.volRatio.toFixed(2)}x ${result.volumeConfirmed ? '✓' : ''}</span></div>
      <div><span>1h ADX(14)</span><span>${result.adxNow.toFixed(1)} ${result.trending ? '(trending)' : '(ranging)'}</span></div>
      <div><span>15m trend</span><span>${result.trendUp15m ? 'UP' : 'DOWN'}</span></div>
      <div><span>1h Bollinger %B</span><span>${(result.bbPercentB * 100).toFixed(0)}%</span></div>
    `;
  }

  async function updateIndicators() {
    checkWeeklyReset();
    renderWeeklyStats();
    const status = document.getElementById('tk-status');
    try {
      await Promise.all(SYMBOLS.map(async ({ sym }) => {
        const [k4h, k1h, k15m] = await Promise.all([
          fetchKlines(sym, '4h', 120),
          fetchKlines(sym, '1h', 60),
          fetchKlines(sym, '15m', 30)
        ]);
        const closes4h = k4h.map(c => c.close);
        const closes1h = k1h.map(c => c.close);
        const volumes1h = k1h.map(c => c.volume);
        const closes15m = k15m.map(c => c.close);
        const result = computeSignal(closes4h, closes1h, k1h, volumes1h, closes15m);
        lastAnalysis[sym] = result;

        // 24h change reused from the already-fetched 1h series (last ~25 candles)
        // instead of a separate API call — same result, one less request per coin.
        const changeCloses = closes1h.slice(-25);
        const change24h = ((changeCloses[changeCloses.length - 1] - changeCloses[0]) / changeCloses[0]) * 100;
        document.getElementById(`price-${sym}`).textContent = '$' + fmtPrice(result.price);
        const changeEl = document.getElementById(`change-${sym}`);
        changeEl.textContent = (change24h >= 0 ? '+' : '') + change24h.toFixed(2) + '% / 25h';
        changeEl.className = 'tk-change ' + (change24h >= 0 ? 'tk-up' : 'tk-down');

        // Trade persistence: never overwrite an active trade. Only open a new one
        // when idle/closed/emergency and a fresh signal fires. Active trades close
        // only via checkTradeClose() (TP/SL) or checkEmergency() (invalidation).
        const ts = tradeState[sym];
        if (!ts || (ts.status !== 'active')) {
          if (result.signal === 'LONG' || result.signal === 'SHORT') {
            tradeState[sym] = {
              status: 'active',
              direction: result.signal,
              entry: result.price,
              sl: result.sl,
              tp: result.tp,
              rr: result.rr,
              strength: result.strength,
              atrAtOpen: result.atrNow,
              trendUpAtOpen: result.trendUp,
              openedAt: Date.now()
            };
            weeklyStats.signals++;
            renderWeeklyStats();
            // Alert already sent by the server-side function — this tab just reflects it visually.
          } else if (!ts) {
            tradeState[sym] = { status: 'idle' };
          }
          // if ts.status === 'closed' or 'emergency' and no new signal yet, leave
          // that result showing until the next real signal opens a new trade.

          // WATCH tier state tracking kept for the on-page "◐ SCANNING" badge —
          // the actual alert (strength 5/8/9/10 only) is sent by the server function.
          if (result.signal === 'WATCH') {
            watchAlertState[sym] = result.watchDirection;
          } else {
            watchAlertState[sym] = null;
          }
        } else {
          // Redundant safety net: also check TP/SL against the freshly fetched
          // REST price every 6s, in case the WebSocket stream ever drops a tick.
          checkTradeClose(sym, result.price);
          if (tradeState[sym] && tradeState[sym].status === 'active') {
            checkEmergency(sym, result);
          }
        }

        renderCard(sym);
      }));
      status.textContent = 'Signals updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      status.textContent = 'Signal update failed — retrying next cycle';
    }
  }

  async function init() {
    root.innerHTML = `
      <div class="tk-header">
        <div>
          <p class="tk-title">Perp entry tracker</p>
          <h1 class="tk-h1">28-Coin Tracker</h1>
        </div>
        <div class="tk-meta">
          <div id="tk-status"><span class="tk-live-label">● LIVE</span> connecting...</div>
          <div class="tk-telegram-status">📲 Telegram alerts run 24/7 server-side — see server history below</div>
          <button class="tk-refresh" id="tk-refresh-btn">Refresh signals</button>
        </div>
      </div>
      <div class="tk-weekly" id="tk-weekly-stats"></div>
      <div class="tk-server-panel" id="tk-server-panel"></div>
      <div class="tk-jumpnav" id="tk-jumpnav"></div>
      <div class="tk-grid" id="tk-grid"></div>
      <div class="tk-footer">
        <b>Logic:</b> trend = price vs 4h EMA50. Entry now requires ALL SIX: 4h trend direction, 15m EMA20 trend
        aligned with it, 1h RSI(14) in the pullback zone, 1h MACD(12,26,9) confirming direction, 1h volume above its
        20-period average, AND 1h ADX(14) above 20 (real trend strength, filters out choppy/ranging markets) —
        stricter filtering means fewer but higher-quality signals. Bollinger %B(20,2) also feeds the strength score,
        penalizing entries already stretched to the band edge. <b>Stop-loss</b> is placed just beyond the nearest
        real swing high/low from the last 40 1h candles (not a flat multiple), bounded between 0.5x-3x ATR so it's
        never unrealistically tight or absurdly wide. <b>Take-profit</b> targets a reward multiple that scales with
        the setup-strength score — 1.5x for a weak setup up to 3.5x for a clean one — so SL and TP genuinely differ
        trade to trade and coin to coin, not a fixed 1:2 every time. Charts stream live 1-minute candles from Binance via WebSocket;
        indicators recompute every 6s (the safe cadence within Binance's public API rate limits at 24 coins
        symbols — true per-second full recompute would risk the connection getting rate-limited). <b>Once a
        LONG/SHORT fires it locks in place</b> — entry/SL/TP stay fixed and the badge won't change even if underlying
        conditions shift, until live price actually hits TP (✓) or SL (✕) — checked on every price tick in real time,
        not on the 5s cycle. A closed trade's result stays visible until the next real
        signal opens a new one. *Max safe leverage keeps your stop-loss distance inside ~80% of your liquidation
        buffer — a survivability limit, not a recommendation. The X/10 is a <b>setup-strength score</b> (trend clarity
        + RSI centering + MACD conviction + volume conviction) — NOT a win probability; no model can honestly produce
        that from price data alone. Most of these majors move together; going long/short on several at once is one
        concentrated bet, not diversification. DOGE and especially PUMP are lower-liquidity, sentiment-driven tokens —
        expect sharper wicks and less reliable stop fills than BTC/ETH/SOL. "Most predictable" is relative — nothing
        here is actually predictable, it just reflects deeper liquidity and historically cleaner trend structure.
        This is a rules-based calculation, not AI prediction and
        not financial advice — it will produce losing trades and does not know your account size. Size your position
        off the entry-to-SL distance. <b>Emergency invalidation:</b> an active trade is force-closed with a flashing
        warning if the 4h trend reverses beyond a small noise buffer and holds for 2 consecutive checks, or if
        volatility (ATR) more than triples since entry and holds for 2 checks — requiring persistence filters out
        one-off blips so this doesn't fire on normal market noise. This page cannot place real
        orders — when you see the warning, close the position on your exchange yourself, immediately. TP/SL are also
        double-checked against fresh price every 6s in addition to every live tick, so a hit is never missed even if
        the stream briefly drops. <b>Telegram alerts (24/7, server-side):</b> a scheduled function
        (netlify/functions/check-signals.js) runs every 5 minutes on Netlify's own servers — independent of whether
        this page or any browser is open — and sends Telegram alerts for every confirmed LONG/SHORT (any strength),
        every TP/SL hit, every emergency invalidation, and WATCH entries at strength 5, 8, 9, or 10/10 only. Requires
        TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID set as Netlify environment variables (never in this file — a token
        embedded in public page source could be used by anyone). <b>WATCH tier:</b> shown (amber, "◐ SCANNING") when the core three factors — trend,
        RSI, and MACD — already agree but ADX/volume/15m alignment haven't confirmed yet. It's informational only:
        no entry/SL/TP is set, it never locks. <b>Two independent trackers:</b> this browser page re-evaluates every
        6s purely for the live view (charts, badges) — the "This tab" stats bar above resets if you refresh or close
        it. The <b>24/7 Server Record</b> panel is the real, persistent count and history — it comes from the
        scheduled function checking every 5 minutes and logging every event permanently via Netlify Blobs, so it
        keeps running and keeps its history whether or not anyone has this page open. The two won't always show
        identical numbers at the same instant since they run on different schedules — the server panel is the one
        that matters for anything you don't want to miss.
      </div>
    `;

    renderWeeklyStats();
    renderSkeleton();
    await Promise.all(SYMBOLS.map(({ sym }) => seedChart(sym)));
    connectLiveStream();
    await updateIndicators();
    await pollServerHistory();
    document.getElementById('tk-refresh-btn').addEventListener('click', updateIndicators);
    setInterval(updateIndicators, 6000);
    setInterval(pollServerHistory, 20000);
    window.addEventListener('resize', () => SYMBOLS.forEach(({ sym }) => drawChart(sym)));
  }

  init();
})();
</script>
